[project]
name = "demobemni"
version = "0.1.0"
description = "Multi-tenant restaurants marketplace MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "sqlalchemy>=2.0.32",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "alembic>=1.13.2",
  "pytest>=8.3.2",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
